services:
  ollama:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/local-coding-ai:latest
    container_name: local-coding-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

volumes:
  ollama-models:
    name: local-coding-ai-models
